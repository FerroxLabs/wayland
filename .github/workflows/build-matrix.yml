# Security review (per security_reminder_hook.py):
# This workflow uses ${{ ... }} only for trusted contexts:
#   - matrix.* values (defined inline in this file, trusted)
#   - needs.* outputs produced by jobs in this same file (trusted)
#   - github.event_name, github.ref, github.workspace, runner.* (trusted)
# No untrusted PR/issue/commit text (github.event.issue.*, head_ref, etc.)
# is ever interpolated into a run: step.

name: Build Matrix

# Cross-platform packaged-build verification for the Wayland fork.
# Runs on push to main and on a weekly nightly schedule.
#
# This is the mandatory recurring native-package proof for all six release
# targets. It intentionally has no repository-variable skip gate.
# Manual trigger:
#   gh workflow run build-matrix.yml
#
# Deliberately NOT a branch-protection required check: every trigger here is
# paths-filtered, and GitHub counts a SKIPPED required check as a PASS
# (documented bypass, see pr-checks.yml lines 10-24). Making it required would
# hand any docs-only PR a free green on the packaged-build gate.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design-mockups/**'
      - '.planning/**'
      - '.blackboard/**'
  schedule:
    # Weekly nightly: Mondays at 09:00 UTC.
    - cron: '0 9 * * 1'
  workflow_dispatch:

concurrency:
  group: build-matrix-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Platform smoke verifies the bundled engine as a critical runtime.
  WCORE_SKIP: '0'
  # Exact FerroxLabs/waylandmcp commit whose four @wayland MCP connectors are
  # bundled into this build. Pinned, not floating, so the installer's connector
  # sources have a recorded identity (#940). Keep byte-identical across all four
  # workflows that check this repo out - waylandmcp SourcePin test enforces it.
  WAYLANDMCP_REF: '29a253804ccd3d7f1eb385cf610b0dc27a130478'
  CI: 'true'
  NODE_OPTIONS: '--max-old-space-size=8192'

jobs:
  # scripts/build-with-builder.js writes a candidate capability seal on every
  # packaged build, and createCapabilitySeal() refuses to run without
  # WAYLAND_CAPABILITY_RECEIPTS_DIR ("required for an evidence-backed package
  # build", scripts/capability-seal/verifyCandidateCapabilitySeal.js:567-570).
  # Nothing here produced those receipts, so from the seal's introduction every
  # leg died seconds into the packaged build and this gate was 100% red - which
  # is why nine packaging defects were first seen at tag time. This job is the
  # same producer the release path uses (_build-reusable.yml lines 100-161).
  capability-acceptance:
    name: Candidate capability acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    outputs:
      artifact-name: ${{ steps.candidate.outputs.artifact-name }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Capture exact candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          if [ "${commit}" != "${GITHUB_SHA}" ]; then
            echo "Refusing to attest a checkout that differs from the workflow's immutable source commit." >&2
            exit 1
          fi
          # readReceiptAuthority() rejects a manifest whose candidate commit+tree
          # differ from the building checkout, so the build job below must resolve
          # to this same commit. It does: it uses a bare actions/checkout on the
          # same push/schedule/dispatch event, which is GITHUB_SHA by definition.
          echo "artifact-name=capability-acceptance-${commit}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate structured exact capability acceptance receipts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/capability-seal/generateCapabilityAcceptanceReceipts.js \
            --out "${RUNNER_TEMP}/capability-acceptance"

      - name: Upload capability acceptance receipts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.candidate.outputs.artifact-name }}
          path: ${{ runner.temp }}/capability-acceptance
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build (${{ matrix.release_track }} / ${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs: capability-acceptance
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform_target:
          - macos-arm64
          - macos-x64
          - windows-x64
          - windows-arm64
          - linux-x64
          - linux-arm64
        release_track: [stable, preview]
        include:
          - platform_target: macos-arm64
            platform: macos-arm64
            os: macos-15
            build_script: build-mac:arm64
            target_platform: darwin
            arch: arm64
          - platform_target: macos-x64
            platform: macos-x64
            os: macos-15-intel
            build_script: build-mac:x64
            target_platform: darwin
            arch: x64
          - platform_target: windows-x64
            platform: windows-x64
            os: windows-2022
            build_script: build-win
            target_platform: win32
            arch: x64
          - platform_target: windows-arm64
            platform: windows-arm64
            os: windows-11-arm
            build_script: build-win:arm64
            target_platform: win32
            arch: arm64
          - platform_target: linux-x64
            platform: linux-x64
            os: ubuntu-24.04
            build_script: build-deb
            target_platform: linux
            arch: x64
          - platform_target: linux-arm64
            platform: linux-arm64
            os: ubuntu-24.04-arm
            build_script: build-deb
            target_platform: linux
            arch: arm64

    env:
      WAYLAND_RELEASE_TRACK: ${{ matrix.release_track }}
      PACKAGE_OUT_DIR: ${{ matrix.release_track == 'preview' && 'out-preview' || 'out' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          # Pinned versions (node = 24, bun = 1.3, just = 1.51) live in
          # ../mise.toml at the workspace root, one level above app/.
          install: true
          cache: true
        continue-on-error: true

      - name: Setup Node.js (fallback if mise did not pick up workspace toml)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Bun (fallback if mise did not pick up workspace toml)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - name: Cache Bun + node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: build-matrix-bun-${{ matrix.platform }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            build-matrix-bun-${{ matrix.platform }}-

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential python3 python3-pip pkg-config \
            libsqlite3-dev fakeroot dpkg-dev rpm \
            libnss3-dev libatk-bridge2.0-dev libdrm2 libxkbcommon-dev \
            libxss1 libatspi2.0-dev libgtk-3-dev libxrandr2 libasound2-dev xvfb

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # #940: the four bundled @wayland MCP connectors (apple, imap, news,
      # cal.com) build from FerroxLabs/waylandmcp. actions/checkout refuses any
      # `path` outside github.workspace, so the sources land at ./waylandmcp
      # (gitignored), and the next step moves it to the sibling position that
      # build-mcp-servers.js already resolves. Must run AFTER the repo checkout
      # above, whose `git clean -ffdx` would delete this tree. No bypass: this
      # gate exists to keep a packaged build from passing while four connectors
      # are missing from it.
      # #940 PROVENANCE: pin the sources to an exact commit. With no `ref` this
      # took whatever FerroxLabs/waylandmcp's default branch happened to hold at
      # build time and recorded that identity nowhere, so a shipped installer
      # carried code no receipt could name. scripts/platform-package-smoke.mjs
      # attests the app's own commit AND its untracked tree precisely because "a
      # newly introduced build input is just as authoritative as a modified
      # tracked file" - but this input lives OUTSIDE the repo and is gitignored,
      # so neither that attestation nor the dirty-tree gate can see it. The pin
      # plus the rev-parse echo in the next step are what put its identity on the
      # record. WAYLANDMCP_REF follows the WAYLAND_HUB_TAG named-constant
      # convention; tests/unit/scripts/waylandmcpSourcePin.test.ts holds the four
      # copies byte-identical so they cannot drift apart.
      - name: Checkout @wayland MCP connector sources
        uses: actions/checkout@v4
        with:
          repository: FerroxLabs/waylandmcp
          ref: ${{ env.WAYLANDMCP_REF }}
          ssh-key: ${{ secrets.WAYLANDMCP_DEPLOY_KEY }}
          path: waylandmcp
          persist-credentials: false

      # Move the checkout OUT of the app repo to /home/runner/work/wayland/waylandmcp,
      # which is the pre-existing sibling candidate. This is a containment fix, not
      # cosmetics: esbuild resolves a bare import by walking node_modules UPWARD from
      # the entry point. Left inside the workspace, that walk continues into the
      # desktop app's ~2100-package node_modules, so a connector importing something
      # it does not declare resolves SILENTLY against the app's copy instead of
      # failing. Proven by A/B: identical source bundles clean in-workspace and dies
      # with "Could not resolve" as a sibling. Green build, wrong artifact is exactly
      # the quiet substitution #940 exists to stop. The rm -rf covers a self-hosted
      # runner, where the sibling path escapes the workspace `git clean -ffdx`.
      - name: Relocate and install @wayland MCP connector sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ../waylandmcp
          mv waylandmcp ../waylandmcp
          cd ../waylandmcp
          # #940 PROVENANCE: say WHICH commit was bundled, and PROVE it is the
          # pinned one. build-mcp-servers.js already logs the PATH it resolved,
          # and a path is not an identity. An empty or malformed WAYLANDMCP_REF
          # would make actions/checkout silently take the default branch instead
          # - the same quiet substitution #940 exists to stop - so assert rather
          # than trust, the same way release-acceptance-trust-root.yml asserts
          # TRUST_ROOT_SHA.
          mcp_sha="$(git rev-parse HEAD)"
          echo "waylandmcp source commit: $mcp_sha"
          [[ "$WAYLANDMCP_REF" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::WAYLANDMCP_REF is not a 40-hex commit: '$WAYLANDMCP_REF'" >&2; exit 1;
          }
          [[ "$mcp_sha" == "$WAYLANDMCP_REF" ]] || {
            echo "::error::waylandmcp HEAD $mcp_sha != pinned $WAYLANDMCP_REF" >&2; exit 1;
          }
          bun install --frozen-lockfile

      - name: Postinstall (CI uses prebuilt binaries; see scripts/postinstall.js)
        run: bun run postinstall || true

      - name: Download exact capability acceptance authority
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.capability-acceptance.outputs.artifact-name }}
          path: ${{ runner.temp }}/capability-acceptance

      # A job-level `env:` entry cannot see the `runner` context (only
      # github/inputs/needs/matrix/strategy/secrets/vars exist there), so this is
      # exported from a step for the same reason, and with the same expression,
      # as _build-reusable.yml lines 249-260. Keeping the expression identical to
      # the download path above means the two cannot drift apart.
      - name: Export capability acceptance authority path
        shell: bash
        env:
          RECEIPTS_DIR: ${{ runner.temp }}/capability-acceptance
        run: echo "WAYLAND_CAPABILITY_RECEIPTS_DIR=${RECEIPTS_DIR}" >> "$GITHUB_ENV"

      - name: Cache Electron artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/.cache/electron
            ${{ runner.temp }}/.cache/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ matrix.platform }}-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            electron-${{ matrix.platform }}-

      - name: Assert native runner identity
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.target_platform }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          node -e 'if (process.platform !== process.env.TARGET_PLATFORM || process.arch !== process.env.TARGET_ARCH) { throw new Error(`runner ${process.platform}-${process.arch} cannot prove ${process.env.TARGET_PLATFORM}-${process.env.TARGET_ARCH}`) }'

      - name: Capture pre-build packaged content state
        id: package-candidate-state
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.target_platform }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          node scripts/platform-package-smoke.mjs \
            --out "$PACKAGE_OUT_DIR" \
            --target-platform "$TARGET_PLATFORM" \
            --target-arch "$TARGET_ARCH" \
            --release-track "$WAYLAND_RELEASE_TRACK" \
            --capture-state "${{ runner.temp }}/wayland-package-candidate-state.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Run packaged build
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder
          # matrix.build_script is defined inline above (trusted).
          BUILD_SCRIPT: ${{ matrix.build_script }}
          # Ad-hoc / unsigned by default. On macOS, electron-builder will
          # skip signing when CSC_LINK is unset; this also disables Keychain
          # autodiscovery on hosted runners.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: bash
        run: |
          rm -rf "$PACKAGE_OUT_DIR"
          bun run "$BUILD_SCRIPT"

      - name: Install and smoke real package payload
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.target_platform }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          node scripts/platform-package-smoke.mjs \
            --out "$PACKAGE_OUT_DIR" \
            --target-platform "$TARGET_PLATFORM" \
            --target-arch "$TARGET_ARCH" \
            --release-track "$WAYLAND_RELEASE_TRACK" \
            --candidate-state-file "${{ runner.temp }}/wayland-package-candidate-state.json" \
            --candidate-state-digest "${{ steps.package-candidate-state.outputs.candidate_state_digest }}"

      # Mirrors _build-reusable.yml lines 717-718, but pins the resources
      # directory explicitly. The test's own fallback
      # (tests/integration/bundled-bun-packaged.test.ts findLatestResourcesDirUnderOut)
      # only scans ./out for a directory whose basename is exactly "resources",
      # which misses the preview track (out-preview) and every macOS bundle
      # (Contents/Resources, capital R). Both resolve to null and the whole file
      # silently it.skip()s to green. Resolve the real payload here and fail loudly
      # when there is none.
      - name: Verify packaged bundled bun assets
        shell: bash
        run: |
          set -euo pipefail
          resources_dir="$(node -e '
            const fs = require("fs");
            const path = require("path");
            const root = path.resolve(process.env.PACKAGE_OUT_DIR);
            const found = [];
            (function walk(dir, depth) {
              if (depth > 6) return;
              let entries;
              try { entries = fs.readdirSync(dir, { withFileTypes: true }); } catch { return; }
              for (const entry of entries) {
                if (!entry.isDirectory()) continue;
                const child = path.join(dir, entry.name);
                if (entry.name.toLowerCase() === "resources" && fs.existsSync(path.join(child, "app.asar"))) {
                  found.push(child);
                } else {
                  walk(child, depth + 1);
                }
              }
            })(root, 0);
            if (found.length === 0) {
              console.error("No packaged resources directory containing app.asar under " + root);
              process.exit(1);
            }
            found.sort((a, b) => fs.statSync(b).mtimeMs - fs.statSync(a).mtimeMs);
            process.stdout.write(found[0]);
          ')"
          echo "APP_RESOURCES_DIR=$resources_dir"
          APP_RESOURCES_DIR="$resources_dir" bun run test:packaged:bun

      - name: List build output
        if: always()
        shell: bash
        run: ls -lah "$PACKAGE_OUT_DIR" || true

      - name: Verify build artifacts exist
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            macos-*)
              ls "$PACKAGE_OUT_DIR"/*.dmg "$PACKAGE_OUT_DIR"/*.zip >/dev/null
              ;;
            windows-*)
              ls "$PACKAGE_OUT_DIR"/*.exe >/dev/null
              ;;
            linux-*)
              ls "$PACKAGE_OUT_DIR"/*.deb >/dev/null
              ;;
          esac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wayland-${{ matrix.release_track }}-${{ matrix.platform }}
          path: |
            ${{ env.PACKAGE_OUT_DIR }}/*.dmg
            ${{ env.PACKAGE_OUT_DIR }}/*.zip
            ${{ env.PACKAGE_OUT_DIR }}/*.exe
            ${{ env.PACKAGE_OUT_DIR }}/*.deb
            ${{ env.PACKAGE_OUT_DIR }}/*latest*.yml
            ${{ env.PACKAGE_OUT_DIR }}/platform-package-smoke-*.json
          if-no-files-found: error
          retention-days: 14
