# Pre-commit configuration for Wayland
# Ensures local checks match CI checks (TypeScript, Oxlint, Oxfmt)
#
# Installation:
#   pip install pre-commit  (or: brew install pre-commit / choco install pre-commit)
#   prek install            (or: pre-commit install)
#
# Run manually on staged files (same as CI pre-commit):
#   prek run
#
# Run on changed files vs main (same as CI PR check):
#   prek run --from-ref origin/main --to-ref HEAD
#
# Run on all files:
#   prek run --all-files

default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      # Captured artifacts and pinned files are NOT source. Rewriting them is
      # either corruption or evidence tampering:
      #  - resources/modelsdev-snapshot.json is pinned by SHA-256 AND byte size,
      #    and is deliberately a single minified line with no trailing newline.
      #    Appending one breaks verify:modelsdev-snapshot and every packaged
      #    build. oxfmt is already excluded from it; so must these.
      #  - *.enc are encrypted constitution fixtures. A trailing newline changes
      #    the ciphertext bytes.
      #  - .planning/**/evidence/**/*.log and *.log generally are captured
      #    command output kept as proof. Editing them falsifies the evidence.
      #  - tests/fixtures/**, strike/**, contracts/** and the pinned skill bodies
      #    are byte- and size-pinned corpora. A trailing newline is a size
      #    change: appending one to two constitution-history transaction records
      #    produced "State drift: size mismatch" in the corpus verifier.
      - id: end-of-file-fixer
        # Only fix text files, exclude binary files and special OS files
        exclude: '^(\.DS_Store|Thumbs\.db|resources/modelsdev-snapshot\.json|src/process/resources/skills/.*|tests/fixtures/.*|strike/.*|contracts/.*|src/process/channels/whatsapp-bridge/.*|.*\.(log|enc|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|pdf|zip|tar|gz|bz2|7z|exe|dll|so|dylib|node|bin))$'
      - id: trailing-whitespace
        # Auto-fix trailing whitespace in text files
        # Excludes binary files (matching end-of-file-fixer pattern)
        exclude: '^(\.DS_Store|Thumbs\.db|resources/modelsdev-snapshot\.json|src/process/resources/skills/.*|tests/fixtures/.*|strike/.*|contracts/.*|src/process/channels/whatsapp-bridge/.*|.*\.(log|enc|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|pdf|zip|tar|gz|bz2|7z|exe|dll|so|dylib|node|bin|patch))$'

  # TypeScript type checking (full project check required)
  - repo: local
    hooks:
      - id: typecheck
        name: TypeScript Check
        entry: bun run typecheck
        language: system
        files: \.(ts|tsx)$
        pass_filenames: false

  # Oxlint (replaces ESLint - checks staged files only)
  - repo: local
    hooks:
      - id: oxlint
        name: Oxlint
        entry: bun run lint
        language: system
        files: \.(ts|tsx|js|jsx)$
        pass_filenames: false

  # Oxfmt (replaces Prettier - auto-fixes staged files only)
  - repo: local
    hooks:
      - id: oxfmt
        name: Oxfmt
        entry: bun run format
        language: system
        # `.mjs`/`.cjs` were missing, so repo scripts written in them were never
        # routed to the formatter at all.
        files: \.(ts|tsx|js|jsx|mjs|cjs|json|css|md|yaml|yml|toml)$
        # NEVER let the formatter touch a pinned or generated artifact:
        #  - skills-library / bundled-workflows index.json: generated,
        #    pretty-printed catalogs copied verbatim at build by
        #    scripts/build-with-builder.js. Data, not source, and not
        #    oxfmt-canonical on main either; formatting churns 60k+ lines.
        #  - resources/modelsdev-snapshot.json: a minified offline floor pinned by
        #    SHA-256 AND byte size. oxfmt pretty-printed it from 1 line to 103,798,
        #    which failed verify:modelsdev-snapshot and broke every packaged build.
        #    tsc, the full unit suite and CI's own formatter all approved that
        #    change; only running the build caught it.
        #  - contracts/**: wire schemas and compatibility fixtures. Their bytes are
        #    the contract, so reformatting them is a silent contract change.
        #  - src/process/resources/skills/**: skill bodies are SHA-256 pinned by
        #    scripts/prepareOfficeCli.js. Reformatting officecli-data-dashboard's
        #    SKILL.md produced "OfficeCLI skill digest mismatch".
        #  - tests/fixtures/** and strike/**: captured corpora pinned by digest AND
        #    byte size, including a .ts generator whose own hash is asserted.
        #    Reformatting them produced "State drift: size mismatch" in the
        #    historical transaction corpus verifier.
        #  - src/process/channels/whatsapp-bridge/**: every file is pinned by size
        #    and SHA-256 in scripts/whatsapp-bridge-source.json and checked by
        #    verify-packaged-resources.js. Reformatting backends/baileys.js
        #    (15582 -> 15420 bytes) broke that authority and therefore every
        #    packaged build. Nothing in the unit suite catches it, because the
        #    verifier needs --target-platform/--target-arch and a built app.
        # Every entry below was added because a formatter run actually broke it.
        # Adding a path here is cheaper than the build or suite failure it prevents.
        exclude: >-
          ^(src/process/resources/(skills-library|bundled-workflows)/index\.json|src/process/resources/skills/.*|resources/modelsdev-snapshot\.json|contracts/.*|tests/fixtures/.*|strike/.*|src/process/channels/whatsapp-bridge/.*)$
        pass_filenames: true

  # i18n translation files validation
  - repo: local
    hooks:
      - id: i18n-check
        name: i18n Check
        entry: node scripts/check-i18n.js
        language: system
        files: ^src/renderer/services/i18n/locales/
        pass_filenames: false

  # UI System token drift validator - fails on undefined CSS-var names
  # (var(--text-tertiary), var(--fill-N), var(--border-N), var(--bg)) that
  # silently fall back to browser defaults. Locks the dark-mode legibility
  # fix shipped in the UI System v1 rollout.
  - repo: local
    hooks:
      - id: ui-tokens-check
        name: UI Tokens Check
        entry: node scripts/check-ui-tokens.js
        language: system
        files: ^src/renderer/.*\.(tsx?|css)$
        pass_filenames: false

  # Commit message format (Conventional Commits)
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, --force-scope, feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]
