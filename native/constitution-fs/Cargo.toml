[package]
name = "wayland-constitution-fs"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
base64 = "0.22"
hmac = "0.12"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
