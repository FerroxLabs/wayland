name: Protected native package observer
run-name: protected-platform-observer candidate=${{ inputs.candidate_commit }} producer=${{ inputs.producer_run_id }} attempt=${{ inputs.producer_run_attempt }}

on:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Exact candidate commit built by the producer run
        required: true
        type: string
      candidate_tree:
        description: Exact candidate tree built by the producer run
        required: true
        type: string
      producer_run_id:
        description: Exact build-and-release run containing the native installers
        required: true
        type: string
      producer_run_attempt:
        description: Exact producer run attempt
        required: true
        type: string
      release_track:
        description: Native package release track
        required: true
        default: stable
        type: choice
        options: [stable, preview]

permissions:
  actions: read
  contents: read

concurrency:
  group: protected-platform-observer-${{ inputs.candidate_commit }}-${{ inputs.producer_run_id }}-${{ inputs.producer_run_attempt }}
  cancel-in-progress: false

jobs:
  observe:
    if: github.ref == 'refs/heads/release-trust-v1'
    permissions:
      actions: read
      contents: read
    env:
      # Candidate application bytes execute in this job. Keep OIDC capability
      # absent even if a future caller broadens workflow-level permissions.
      ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
      ACTIONS_ID_TOKEN_REQUEST_URL: ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-15
            artifact: macos-build-arm64
            platform: darwin
            arch: arm64
            extension: dmg
          - target: darwin-x64
            os: macos-15-intel
            artifact: macos-build-x64
            platform: darwin
            arch: x64
            extension: dmg
          - target: win32-arm64
            os: windows-11-arm
            artifact: windows-build-arm64
            platform: win32
            arch: arm64
            extension: exe
          - target: win32-x64
            os: windows-2022
            artifact: windows-build-x64
            platform: win32
            arch: x64
            extension: exe
          - target: linux-arm64
            os: ubuntu-24.04-arm
            artifact: linux-build-arm64
            platform: linux
            arch: arm64
            extension: deb
          - target: linux-x64
            os: ubuntu-24.04
            artifact: linux-build-x64
            platform: linux
            arch: x64
            extension: deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout pinned protected observer
        uses: actions/checkout@v6
        with:
          ref: release-trust-v1
          path: trust
          persist-credentials: false

      - name: Checkout exact candidate as data
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_commit }}
          path: candidate
          persist-credentials: false

      - name: Verify protected and candidate identities
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.candidate_commit }}
          EXPECTED_TREE: ${{ inputs.candidate_tree }}
        run: |
          set -euo pipefail
          test "$(git -C trust rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git -C candidate status --porcelain=v1 --untracked-files=all)"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install protected observer dependencies
        working-directory: trust
        shell: bash
        run: |
          # Retry: package.json pins a GitHub git dependency, so install traffic
          # hits api.github.com and an API 504 reds out this check for reasons
          # unrelated to the diff. Not a flaky-test workaround. Backoff 20s/40s
          # because an API outage outlasts a transient git fetch.
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile; then exit 0; fi
            echo "bun install attempt $attempt of 3 failed" >&2
            if [[ $attempt -lt 3 ]]; then sleep $(( attempt * 20 )); fi
          done
          echo "bun install failed after 3 attempts (GitHub API or registry unreachable)" >&2
          exit 1

      - name: Capture empty pre-download package state
        id: package-state
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_TRACK: ${{ inputs.release_track }}
        run: |
          set -euo pipefail
          mkdir payload
          cd candidate
          node ../trust/scripts/platform-package-smoke.mjs \
            --out ../payload \
            --target-platform "$TARGET_PLATFORM" \
            --target-arch "$TARGET_ARCH" \
            --release-track "$RELEASE_TRACK" \
            --capture-state "$RUNNER_TEMP/protected-package-state.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Download exact producer installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ inputs.producer_run_attempt }}
          ARTIFACT_NAME: ${{ matrix.artifact }}
          EXPECTED_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -euo pipefail
          producer="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER_RUN_ID")"
          actual_attempt="$(printf '%s' "$producer" | jq -r .run_attempt)"
          test "$actual_attempt" = "$PRODUCER_RUN_ATTEMPT"
          test "$(printf '%s' "$producer" | jq -r .head_sha)" = "$EXPECTED_COMMIT"
          test "$(printf '%s' "$producer" | jq -r .path)" = ".github/workflows/build-and-release.yml"
          producer_state="$(printf '%s' "$producer" | jq -r '[.status, (.conclusion // "null")] | join(":")')"
          case "$producer_state" in
            in_progress:null|completed:success) ;;
            *) echo "producer run is not an admissible exact build state: $producer_state" >&2; exit 1 ;;
          esac
          gh run download "$PRODUCER_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir payload

      - name: Independently observe installed native package
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
          RELEASE_TRACK: ${{ inputs.release_track }}
          CANDIDATE_STATE_DIGEST: ${{ steps.package-state.outputs.candidate_state_digest }}
        run: |
          set -euo pipefail
          cd candidate
          node ../trust/scripts/platform-package-smoke.mjs \
            --out ../payload \
            --target-platform "$TARGET_PLATFORM" \
            --target-arch "$TARGET_ARCH" \
            --release-track "$RELEASE_TRACK" \
            --candidate-state-file "$RUNNER_TEMP/protected-package-state.json" \
            --candidate-state-digest "$CANDIDATE_STATE_DIGEST"

      - name: Upload untrusted native observation bytes
        uses: actions/upload-artifact@v6
        with:
          name: unsigned-platform-observation-${{ matrix.target }}-${{ inputs.candidate_commit }}
          path: |
            payload/platform-package-smoke-${{ matrix.target }}.json
            payload/*.dmg
            payload/*.exe
            payload/*.deb
          if-no-files-found: error
          retention-days: 14

  sign:
    name: Sign protected observation (${{ matrix.target }})
    needs: observe
    if: github.ref == 'refs/heads/release-trust-v1'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            platform: darwin
            arch: arm64
            extension: dmg
          - target: darwin-x64
            platform: darwin
            arch: x64
            extension: dmg
          - target: win32-arm64
            platform: win32
            arch: arm64
            extension: exe
          - target: win32-x64
            platform: win32
            arch: x64
            extension: exe
          - target: linux-arm64
            platform: linux
            arch: arm64
            extension: deb
          - target: linux-x64
            platform: linux
            arch: x64
            extension: deb
    steps:
      - name: Checkout pinned signing authority only
        uses: actions/checkout@v6
        with:
          ref: release-trust-v1
          path: trust
          persist-credentials: false

      - name: Verify signing authority identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C trust rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C trust status --porcelain=v1 --untracked-files=all)"

      - name: Download same-run untrusted observation bundle
        uses: actions/download-artifact@v5
        with:
          name: unsigned-platform-observation-${{ matrix.target }}-${{ inputs.candidate_commit }}
          path: payload

      - name: Validate bytes and create protected receipt
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_TREE: ${{ inputs.candidate_tree }}
          INSTALLER_EXTENSION: ${{ matrix.extension }}
          WAYLAND_OBSERVED_PLATFORM: ${{ matrix.platform }}
          WAYLAND_OBSERVED_ARCH: ${{ matrix.arch }}
          WAYLAND_PROTECTED_SIGNING_JOB: 'true'
          WAYLAND_PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          WAYLAND_PRODUCER_RUN_ATTEMPT: ${{ inputs.producer_run_attempt }}
        run: |
          set -euo pipefail
          report="payload/platform-package-smoke-$TARGET.json"
          test -f "$report"
          installer_count="$(find payload -maxdepth 1 -type f -iname "*.$INSTALLER_EXTENSION" -print | wc -l | tr -d ' ')"
          test "$installer_count" -eq 1
          installer="$(find payload -maxdepth 1 -type f -iname "*.$INSTALLER_EXTENSION" -print)"
          node trust/scripts/release-acceptance/createProtectedPlatformObservation.js \
            --target "$TARGET" \
            --commit "$CANDIDATE_COMMIT" \
            --tree "$CANDIDATE_TREE" \
            --report "$report" \
            --installer "$installer" \
            --out "payload/protected-platform-observation-$TARGET.json"

      - name: Attest protected observation receipt
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: payload/protected-platform-observation-${{ matrix.target }}.json

      - name: Upload exact signed observation bundle
        uses: actions/upload-artifact@v6
        with:
          name: protected-platform-observation-${{ matrix.target }}-${{ inputs.candidate_commit }}
          path: |
            payload/protected-platform-observation-${{ matrix.target }}.json
            payload/platform-package-smoke-${{ matrix.target }}.json
            payload/*.dmg
            payload/*.exe
            payload/*.deb
          if-no-files-found: error
          retention-days: 14
