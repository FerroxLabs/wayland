name: '🔨 Manual Build'

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: true
        default: 'main'
        type: string
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options:
          - macos-arm64
          - macos-x64
          - windows-x64
          - windows-arm64
          - linux-x64
          - linux-arm64
          - all
        default: 'macos-arm64'
      skip_code_quality:
        description: 'Skip code quality checks (faster builds for debugging)'
        required: false
        type: boolean
        default: false
      chat_smoke:
        description: 'Windows only: after the build, install the real installer and verify a CHAT TURN completes'
        required: false
        type: boolean
        default: false

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  prepare-matrix:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Generate build matrix
        id: set-matrix
        shell: bash
        run: |
          PLATFORM="${{ inputs.platform }}"

          MACOS_ARM64='{"platform":"macos-arm64","target_platform":"darwin","os":"macos-15","command":"node scripts/build-with-builder.js arm64 --mac --arm64","artifact-name":"macos-build-arm64","arch":"arm64"}'
          MACOS_X64='{"platform":"macos-x64","target_platform":"darwin","os":"macos-15-intel","command":"node scripts/build-with-builder.js x64 --mac --x64","artifact-name":"macos-build-x64","arch":"x64"}'
          WINDOWS_X64='{"platform":"windows-x64","target_platform":"win32","os":"windows-2022","command":"node scripts/build-with-builder.js x64 --win --x64","artifact-name":"windows-build-x64","arch":"x64"}'
          WINDOWS_ARM64='{"platform":"windows-arm64","target_platform":"win32","os":"windows-11-arm","command":"node scripts/build-with-builder.js arm64 --win --arm64","artifact-name":"windows-build-arm64","arch":"arm64"}'
          LINUX_X64='{"platform":"linux-x64","target_platform":"linux","os":"ubuntu-24.04","command":"node scripts/build-with-builder.js x64 --linux --x64","artifact-name":"linux-build-x64","arch":"x64"}'
          LINUX_ARM64='{"platform":"linux-arm64","target_platform":"linux","os":"ubuntu-24.04-arm","command":"node scripts/build-with-builder.js arm64 --linux --arm64","artifact-name":"linux-build-arm64","arch":"arm64"}'

          if [ "$PLATFORM" = "all" ]; then
            MATRIX="{\"include\":[$MACOS_ARM64,$MACOS_X64,$WINDOWS_X64,$WINDOWS_ARM64,$LINUX_X64,$LINUX_ARM64]}"
          elif [ "$PLATFORM" = "macos-arm64" ]; then
            MATRIX="{\"include\":[$MACOS_ARM64]}"
          elif [ "$PLATFORM" = "macos-x64" ]; then
            MATRIX="{\"include\":[$MACOS_X64]}"
          elif [ "$PLATFORM" = "windows-x64" ]; then
            MATRIX="{\"include\":[$WINDOWS_X64]}"
          elif [ "$PLATFORM" = "windows-arm64" ]; then
            MATRIX="{\"include\":[$WINDOWS_ARM64]}"
          elif [ "$PLATFORM" = "linux-x64" ]; then
            MATRIX="{\"include\":[$LINUX_X64]}"
          elif [ "$PLATFORM" = "linux-arm64" ]; then
            MATRIX="{\"include\":[$LINUX_ARM64]}"
          fi

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Generated matrix for platform '$PLATFORM':"
          echo "$MATRIX" | python3 -m json.tool

  build-pipeline:
    needs: prepare-matrix
    uses: ./.github/workflows/_build-reusable.yml
    permissions:
      actions: read
      contents: read
    with:
      matrix: ${{ needs.prepare-matrix.outputs.matrix }}
      ref: ${{ inputs.branch }}
      skip_code_quality: ${{ inputs.skip_code_quality }}
      append_commit_hash: true
      upload_installers_only: true
    secrets: inherit

  # Windows packaged CHAT verification.
  #
  # `_build-reusable.yml` already proves a Windows installer installs, boots,
  # reports its capabilities and shuts down cleanly. It does NOT prove a chat
  # turn completes, because that needs a live provider credential. So the
  # Windows chat seam has only ever been verified by hand on a physical box,
  # and whenever that box is unavailable the gate silently degrades to
  # "verified to boot".
  #
  # This closes it on hosted infrastructure. The Windows runner demonstrably
  # can already drive the packaged app - the platform package smoke silently
  # installs it and speaks CDP to it - so the only missing piece was the key.
  #
  # It consumes the installer THIS run just produced, so what is smoked is
  # exactly what users receive. Opt-in, and it publishes nothing.
  windows-chat-smoke:
    name: Windows packaged chat
    needs: build-pipeline
    if: ${{ inputs.chat_smoke && startsWith(inputs.platform, 'windows') }}
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        shell: pwsh
        env:
          # The smoke drives an ALREADY-PACKAGED app over CDP and never needs a
          # downloaded browser. A half-populated puppeteer cache is a known
          # Windows build killer, so not fetching one is both faster and safer.
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: bun install --frozen-lockfile

      - name: Download the installer this run produced
        uses: actions/download-artifact@v4
        with:
          pattern: windows-build-*
          path: installer
          merge-multiple: true

      - name: Silent-install the packaged app
        shell: pwsh
        run: |
          Get-ChildItem installer -Recurse -Filter *.exe | Select-Object FullName,Length | Format-Table -AutoSize
          $exe = (Get-ChildItem installer -Recurse -Filter '*.exe' |
                  Where-Object { $_.Name -notlike '*elevate*' } |
                  Sort-Object Length -Descending | Select-Object -First 1)
          if (-not $exe) { throw 'no installer .exe in the artifact' }
          $root = Join-Path $env:RUNNER_TEMP 'wayland-install'
          Write-Host "installing $($exe.FullName) -> $root"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '/S', "/D=$root" -PassThru -Wait
          Write-Host "installer exit = $($p.ExitCode)"
          $app = Join-Path $root 'Wayland.exe'
          if (-not (Test-Path $app)) {
            Get-ChildItem $root -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object FullName | Format-Table -AutoSize
            throw "Wayland.exe not found under $root"
          }
          # Hash the engine from the INSTALLED tree rather than trusting the
          # build log: the engine identity is what a chat turn exercises.
          $eng = Join-Path $root 'resources\bundled-wayland-core\win32-x64\wayland-core.exe'
          if (Test-Path $eng) {
            Write-Host "ENGINE_SHA256=$((Get-FileHash $eng -Algorithm SHA256).Hash.ToLower())"
          } else {
            Write-Host 'ENGINE_SHA256=MISSING'
          }
          "WAYLAND_APP=$app" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run the packaged cockpit chat smoke
        shell: pwsh
        env:
          WAYLAND_SMOKE_FLUX_KEY: ${{ secrets.WAYLAND_SMOKE_FLUX_KEY }}
        run: |
          if (-not $env:WAYLAND_SMOKE_FLUX_KEY) {
            throw 'secret WAYLAND_SMOKE_FLUX_KEY is not set; the chat leg cannot run without a provider credential'
          }
          $keyDir = Join-Path $env:RUNNER_TEMP 'smoke-key'
          New-Item -ItemType Directory -Force -Path $keyDir | Out-Null
          $keyFile = Join-Path $keyDir 'flux-test-key'
          # The harness reads credentials from a FILE by design, never from
          # argv, so the key never reaches a command line or a process list.
          [IO.File]::WriteAllText($keyFile, $env:WAYLAND_SMOKE_FLUX_KEY)
          try {
            node scripts/packaged-cockpit-smoke.mjs --app "$env:WAYLAND_APP" --key-file $keyFile --report-dir smoke-report
          } finally {
            Remove-Item -Force $keyFile -ErrorAction SilentlyContinue
          }

      - name: Report verdict
        if: always()
        shell: pwsh
        run: |
          $r = 'smoke-report/report.json'
          if (-not (Test-Path $r)) { Write-Host 'no report.json produced'; exit 0 }
          $j = Get-Content $r -Raw | ConvertFrom-Json
          Write-Host "passed=$($j.passed) chatOk=$($j.chat.ok) answerVerifiedInDom=$($j.chat.answerVerifiedInDom) messageBlocks=$($j.chat.messageBlocks)"
          if ($j.chat.error) { Write-Host "chatError=$($j.chat.error)" }
          if ($j.chat.stallCapture) { Write-Host 'STALL CAPTURED - see the uploaded report' }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-chat-smoke-report
          path: smoke-report
          if-no-files-found: warn
