name: Build and Release

permissions:
  contents: read

on:
  push:
    branches: [dev]
    tags:
      - '*'

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'
  # #940: four @wayland MCP connectors (apple, imap, news, cal.com) build from
  # the sibling waylandmcp repo, which has no GitHub remote yet - CI cannot
  # check it out. scripts/build-mcp-servers.js now FAILS the build when a
  # connector cannot be bundled, so CI must opt out explicitly until that repo
  # lands. DELETE this line the moment waylandmcp is checkout-able in CI; that
  # is the whole point of the gate.
  WAYLAND_ALLOW_MISSING_MCP: '1'

jobs:
  build-pipeline:
    name: Build Pipeline
    uses: ./.github/workflows/_build-reusable.yml
    permissions:
      actions: read
      contents: read
    # dev 分支或正式 tag 触发构建（排除 -dev- tag，避免重复构建）
    if: github.ref == 'refs/heads/dev' || (startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-dev-'))
    with:
      matrix: >-
        {"include":[
          {"platform":"macos-arm64","target_platform":"darwin","os":"macos-15","command":"node scripts/build-with-builder.js arm64 --mac --arm64","artifact-name":"macos-build-arm64","arch":"arm64"},
          {"platform":"macos-x64","target_platform":"darwin","os":"macos-15-intel","command":"node scripts/build-with-builder.js x64 --mac --x64","artifact-name":"macos-build-x64","arch":"x64"},
          {"platform":"windows-x64","target_platform":"win32","os":"windows-2022","command":"node scripts/build-with-builder.js x64 --win --x64","artifact-name":"windows-build-x64","arch":"x64"},
          {"platform":"windows-arm64","target_platform":"win32","os":"windows-11-arm","command":"node scripts/build-with-builder.js arm64 --win --arm64","artifact-name":"windows-build-arm64","arch":"arm64"},
          {"platform":"linux-x64","target_platform":"linux","os":"ubuntu-24.04","command":"node scripts/build-with-builder.js x64 --linux --x64","artifact-name":"linux-build-x64","arch":"x64"},
          {"platform":"linux-arm64","target_platform":"linux","os":"ubuntu-24.04-arm","command":"node scripts/build-with-builder.js arm64 --linux --arm64","artifact-name":"linux-build-arm64","arch":"arm64"}
        ]}
    secrets: inherit

  # 自动重试 workflow（当构建失败时）
  auto-retry-workflow:
    name: Auto Retry on Build Failure
    runs-on: ubuntu-latest
    needs: build-pipeline
    permissions:
      actions: write
      contents: read
    # 关键：只在首次失败时触发，避免无限循环
    if: |
      failure() &&
      github.run_attempt == 1 &&
      (github.event_name == 'push' || github.event_name == 'schedule')

    steps:
      - name: Log retry information
        run: |
          echo "=========================================="
          echo "🔄 Auto retry triggered (first failure)"
          echo "=========================================="
          echo "Build failed on first attempt, preparing auto retry..."
          echo "Current attempt: ${{ github.run_attempt }}"
          echo "Wait strategy: 5 minutes cooldown before retry"
          echo "=========================================="

      - name: Wait before retry (5 min cooldown)
        run: |
          echo "⏳ Waiting 5 minutes before retry..."
          echo "Start: $(date)"
          sleep 300
          echo "End: $(date)"
          echo "Triggering retry..."

      - name: Trigger workflow rerun
        run: |
          echo "🔄 Triggering full workflow rerun (attempt 2)..."

          # Use re-run API (not rerun-failed-jobs, to avoid loops)
          response=$(curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -w "\n%{http_code}" \
            https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/rerun)

          http_code=$(echo "$response" | tail -n1)

          if [ "$http_code" = "201" ]; then
            echo ""
            echo "✅ Retry triggered successfully"
            echo "This will be attempt 2"
            echo "Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo ""
            echo "❌ Retry trigger failed, HTTP status: $http_code"
            echo "Response:"
            echo "$response" | head -n-1
            exit 1
          fi

  # 自动创建tag（仅 dev 分支推送时）
  create-tag:
    name: Create Tag from Branch
    runs-on: ubuntu-latest
    needs: [build-pipeline]
    permissions:
      contents: write
    if: success() && github.ref == 'refs/heads/dev'
    outputs:
      tag_name: ${{ steps.create_tag.outputs.tag_name }}
      is_dev: ${{ steps.create_tag.outputs.is_dev }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Create and push tag
        id: create_tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          BRANCH_NAME=${GITHUB_REF#refs/heads/}

          # 根据分支确定 tag 格式
          if [ "$BRANCH_NAME" = "dev" ]; then
            TAG_NAME="v${VERSION}-dev-${COMMIT_SHORT}"
            IS_DEV="true"
            echo "🔧 Development release: $TAG_NAME"
          else
            TAG_NAME="v$VERSION"
            IS_DEV="false"
            echo "🚀 Production release: $TAG_NAME"
          fi

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "is_dev=$IS_DEV" >> $GITHUB_OUTPUT

          # 检查远程tag是否已存在
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG_NAME$"; then
            if [ "$IS_DEV" = "false" ]; then
              # Main 分支：需要递增版本并修改 package.json
              echo "⚠️ Tag $TAG_NAME already exists, auto-incrementing version..."

              if [[ $VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                MAJOR=${BASH_REMATCH[1]}
                MINOR=${BASH_REMATCH[2]}
                PATCH=${BASH_REMATCH[3]}
                NEW_PATCH=$((PATCH + 1))
                NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"

                echo "📝 Updating package.json version to $NEW_VERSION"

                # 更新 package.json 版本号
                bun pm version $NEW_VERSION

                # 配置git用户信息
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"

                # 提交版本更新
                git add package.json bun.lock
                git commit -m "chore: bump version to $NEW_VERSION"
                git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git
                git push origin $BRANCH_NAME

                # 获取新的 commit ID
                COMMIT_SHORT=$(git rev-parse --short HEAD)
                TAG_NAME="v${NEW_VERSION}-${COMMIT_SHORT}"

                echo "🚀 New tag with updated version: $TAG_NAME"
                echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
              else
                TAG_NAME="v${VERSION}-${COMMIT_SHORT}"
                echo "⚠️ Fallback: creating tag with commit ID: $TAG_NAME"
                echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
              fi
            else
              # Dev 分支 tag 已存在则失败（不应该发生）
              echo "⚠️ Dev tag $TAG_NAME already exists, this shouldn't happen"
              exit 1
            fi
          fi

          # 配置git用户信息（如果前面没配置）
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 创建并推送tag
          echo "Creating tag: $TAG_NAME"
          git tag $TAG_NAME
          git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin $TAG_NAME
          echo "✅ Successfully created and pushed tag: $TAG_NAME"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

  # 发布到 GitHub Releases
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-pipeline, create-tag]
    permissions:
      contents: write
    # Tag 推送时 create-tag 会被跳过，所以需要检查两种情况（排除 -dev- tag 避免重复）
    if: always() && needs.build-pipeline.result == 'success' && (needs.create-tag.result == 'success' || (startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-dev-')))
    # dev 分支使用 dev-release 环境，正式 tag 使用 release 环境
    environment: ${{ needs.create-tag.outputs.is_dev == 'true' && 'dev-release' || 'release' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get version for release
        id: version
        run: |
          # 判断触发来源：正式 tag 推送 or dev 分支
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # 正式 Tag 推送触发（-dev- tag 已被排除，不会到达这里）
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            IS_DEV="false"
            echo "🚀 Creating stable release from tag: $TAG_NAME"
          else
            # dev 分支触发，使用 create-tag job 的输出
            TAG_NAME="${{ needs.create-tag.outputs.tag_name }}"
            IS_DEV="${{ needs.create-tag.outputs.is_dev }}"
            echo "🔧 Creating development release: $TAG_NAME"
          fi

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "is_dev=$IS_DEV" >> $GITHUB_OUTPUT

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: build-artifacts

      - name: Prepare release assets (normalize updater metadata)
        shell: bash
        run: bash scripts/prepare-release-assets.sh build-artifacts release-assets

      # #989: assert the COMPLETE expected artifact set before anything is
      # published. verify-release-assets.sh previously ran only against the CI
      # mock fixture in pr-checks.yml, so it never saw a real release - which is
      # why #941 (the Windows portable zip dropped by a bad upload glob) reached
      # users unnoticed for several releases. Running it here, on the real
      # normalized assets, is what makes it an actual gate: a missing artifact
      # class now fails the job before the draft release is created.
      - name: Verify release assets (complete expected set)
        shell: bash
        run: bash scripts/verify-release-assets.sh release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ${{ steps.version.outputs.is_dev == 'true' && format('Development Build {0}', steps.version.outputs.tag_name) || steps.version.outputs.tag_name }}
          files: |
            release-assets/**/*.exe
            release-assets/**/*.msi
            release-assets/**/*.dmg
            release-assets/**/*.deb
            release-assets/**/*.AppImage
            release-assets/**/*.rpm
            release-assets/**/*.zip
            release-assets/**/*.yml
            release-assets/**/*.blockmap
          generate_release_notes: true
          draft: true
          prerelease: ${{ steps.version.outputs.is_dev == 'true' || contains(steps.version.outputs.tag_name, 'beta') || contains(steps.version.outputs.tag_name, 'alpha') || contains(steps.version.outputs.tag_name, 'rc') }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

  # 发布前体检：在草稿发布上对真实下载件跑用户路径校验，绿了才公开。
  # The release above is created as a DRAFT. This gate downloads the draft's real
  # assets and runs the exact user path (Gatekeeper on the dmg the way a browser
  # download triggers it, plus the live provider-connect probe). It only flips
  # the draft to PUBLISHED on green — so a broken download can never reach users.
  # This is what stops the "ship, then find out" cycle.
  release-smoke-gate:
    name: Release Smoke Gate (macOS install)
    runs-on: macos-14
    needs: [release]
    permissions:
      contents: read
    # Real tag releases only (dev builds skip the gate).
    if: |
      always() && needs.release.result == 'success' &&
      startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-dev-')
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps (for the connect probe)
        shell: bash
        run: |
          # Retry: package.json pins a GitHub git dependency, so install traffic
          # hits api.github.com and an API 504 reds out this check for reasons
          # unrelated to the diff. Not a flaky-test workaround. Backoff 20s/40s
          # because an API outage outlasts a transient git fetch.
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile; then exit 0; fi
            echo "bun install attempt $attempt of 3 failed" >&2
            if [[ $attempt -lt 3 ]]; then sleep $(( attempt * 20 )); fi
          done
          echo "bun install failed after 3 attempts (GitHub API or registry unreachable)" >&2
          exit 1

      - name: Resolve tag
        id: tag
        run: echo "tag_name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: macOS install gate (Gatekeeper on the real dmg)
        run: bash scripts/release-smoke-macos.sh --tag "${{ steps.tag.outputs.tag_name }}"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Provider-connect gate
        run: bun run scripts/release-smoke-connect.ts
        env:
          # Optional: set these repo secrets to gate REAL auth (catches a valid
          # key rejected by a wrong regional host). Absent = Tier-1 only.
          SMOKE_KEY_OPENAI: ${{ secrets.SMOKE_KEY_OPENAI }}
          SMOKE_KEY_ANTHROPIC: ${{ secrets.SMOKE_KEY_ANTHROPIC }}
          SMOKE_KEY_MINIMAX: ${{ secrets.SMOKE_KEY_MINIMAX }}
          SMOKE_KEY_MOONSHOT: ${{ secrets.SMOKE_KEY_MOONSHOT }}
          SMOKE_KEY_OLLAMA_CLOUD: ${{ secrets.SMOKE_KEY_OLLAMA_CLOUD }}

  # Windows mirror of the macOS install gate: download the draft's .exe assets
  # and verify each is validly Authenticode-signed by Ferrox Labs (Azure Trusted
  # Signing). An unsigned or wrong-publisher installer fails the release here,
  # before publish, instead of reaching users.
  release-smoke-gate-windows:
    name: Release Smoke Gate (Windows signature)
    runs-on: windows-2022
    needs: [release]
    permissions:
      contents: read
    # Real tag releases only (dev builds skip the gate).
    if: |
      always() && needs.release.result == 'success' &&
      startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-dev-')
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Resolve tag
        id: tag
        shell: bash
        run: echo "tag_name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Windows install gate (Authenticode on the real exe)
        shell: pwsh
        run: pwsh scripts/release-smoke-windows.ps1 -Tag "${{ steps.tag.outputs.tag_name }}"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

  protected-platform-observations:
    name: Observe all six native installers under protected code
    runs-on: ubuntu-24.04
    needs: [build-pipeline]
    if: |
      always() && needs.build-pipeline.result == 'success' &&
      startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-dev-')
    permissions:
      actions: write
      contents: read
    steps:
      - name: Resolve exact candidate tree without checking out candidate code
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tree="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/$GITHUB_SHA" --jq .tree.sha)"
          [[ "$tree" =~ ^[0-9a-f]{40,64}$ ]]
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - name: Dispatch deterministic protected native observer
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TREE: ${{ steps.candidate.outputs.tree }}
        run: |
          set -euo pipefail
          requested_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          expected_title="protected-platform-observer candidate=$GITHUB_SHA producer=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
          gh workflow run protected-platform-package-observer.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref release-trust-v1 \
            -f candidate_commit="$GITHUB_SHA" \
            -f candidate_tree="$CANDIDATE_TREE" \
            -f producer_run_id="$GITHUB_RUN_ID" \
            -f producer_run_attempt="$GITHUB_RUN_ATTEMPT" \
            -f release_track=stable
          echo "requested_at=$requested_at" >> "$GITHUB_OUTPUT"
          echo "expected_title=$expected_title" >> "$GITHUB_OUTPUT"

      - name: Resolve and require the exact protected observer run
        id: observer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_AT: ${{ steps.dispatch.outputs.requested_at }}
          EXPECTED_TITLE: ${{ steps.dispatch.outputs.expected_title }}
        run: |
          set -euo pipefail
          run_id=''
          for attempt in $(seq 1 30); do
            run_id="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/protected-platform-package-observer.yml/runs?event=workflow_dispatch&branch=release-trust-v1&per_page=50" \
              --jq ".workflow_runs | map(select(.created_at >= \"$REQUESTED_AT\" and .display_title == \"$EXPECTED_TITLE\")) | sort_by(.created_at) | last | .id // empty")"
            test -n "$run_id" && break
            sleep 10
          done
          [[ "$run_id" =~ ^[0-9]+$ ]]
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id")"
          test "$(jq -r .display_title <<<"$run")" = "$EXPECTED_TITLE"
          test "$(jq -r .head_branch <<<"$run")" = 'release-trust-v1'
          test "$(jq -r .conclusion <<<"$run")" = 'success'
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download all exact signed native observation bundles
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OBSERVER_RUN_ID: ${{ steps.observer.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir protected-platform-observations
          for target in darwin-arm64 darwin-x64 win32-arm64 win32-x64 linux-arm64 linux-x64; do
            name="protected-platform-observation-${target}-${GITHUB_SHA}"
            gh run download "$OBSERVER_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "$name" \
              --dir "protected-platform-observations/$target"
            test -f "protected-platform-observations/$target/protected-platform-observation-$target.json"
            test -f "protected-platform-observations/$target/platform-package-smoke-$target.json"
          done

      - name: Upload exact protected observation set into the producer run
        uses: actions/upload-artifact@v6
        with:
          name: protected-platform-observations-${{ github.sha }}
          path: protected-platform-observations
          if-no-files-found: error
          retention-days: 7

  protected-updater-observations:
    name: Exercise protected updater journeys on all six native targets
    runs-on: ubuntu-24.04
    needs: [build-pipeline]
    if: |
      always() && needs.build-pipeline.result == 'success' &&
      startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-dev-')
    permissions:
      actions: write
      contents: read
    steps:
      - name: Resolve exact candidate tree without checking out candidate code
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tree="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/$GITHUB_SHA" --jq .tree.sha)"
          [[ "$tree" =~ ^[0-9a-f]{40,64}$ ]]
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - name: Dispatch deterministic protected updater observer
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TREE: ${{ steps.candidate.outputs.tree }}
        run: |
          set -euo pipefail
          requested_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          expected_title="protected-updater-observer candidate=$GITHUB_SHA producer=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
          gh workflow run protected-updater-journey-observer.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref release-trust-v1 \
            -f candidate_commit="$GITHUB_SHA" \
            -f candidate_tree="$CANDIDATE_TREE" \
            -f producer_run_id="$GITHUB_RUN_ID" \
            -f producer_run_attempt="$GITHUB_RUN_ATTEMPT" \
            -f release_track=stable
          echo "requested_at=$requested_at" >> "$GITHUB_OUTPUT"
          echo "expected_title=$expected_title" >> "$GITHUB_OUTPUT"

      - name: Resolve and require the exact protected updater run
        id: observer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_AT: ${{ steps.dispatch.outputs.requested_at }}
          EXPECTED_TITLE: ${{ steps.dispatch.outputs.expected_title }}
        run: |
          set -euo pipefail
          run_id=''
          for attempt in $(seq 1 30); do
            run_id="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/protected-updater-journey-observer.yml/runs?event=workflow_dispatch&branch=release-trust-v1&per_page=50" \
              --jq ".workflow_runs | map(select(.created_at >= \"$REQUESTED_AT\" and .display_title == \"$EXPECTED_TITLE\")) | sort_by(.created_at) | last | .id // empty")"
            test -n "$run_id" && break
            sleep 10
          done
          [[ "$run_id" =~ ^[0-9]+$ ]]
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id")"
          test "$(jq -r .display_title <<<"$run")" = "$EXPECTED_TITLE"
          test "$(jq -r .head_branch <<<"$run")" = 'release-trust-v1'
          test "$(jq -r .conclusion <<<"$run")" = 'success'
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download all exact protected updater observations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OBSERVER_RUN_ID: ${{ steps.observer.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir protected-updater-observations
          for target in darwin-arm64 darwin-x64 win32-arm64 win32-x64 linux-arm64 linux-x64; do
            name="protected-updater-observation-${target}-${GITHUB_SHA}"
            gh run download "$OBSERVER_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "$name" \
              --dir "protected-updater-observations/$target"
            test -f "protected-updater-observations/$target/observation.json"
          done

      - name: Upload exact updater observation set into the producer run
        uses: actions/upload-artifact@v6
        with:
          name: protected-updater-observations-${{ github.sha }}
          path: protected-updater-observations
          if-no-files-found: error
          retention-days: 7

  assemble-raw-release-acceptance:
    name: Assemble immutable raw release acceptance bytes
    runs-on: ubuntu-latest
    needs:
      [
        build-pipeline,
        release-smoke-gate,
        release-smoke-gate-windows,
        protected-platform-observations,
        protected-updater-observations,
      ]
    if: |
      always() &&
      needs.build-pipeline.result == 'success' &&
      needs.release-smoke-gate.result == 'success' &&
      needs.release-smoke-gate-windows.result == 'success' &&
      needs.protected-platform-observations.result == 'success' &&
      needs.protected-updater-observations.result == 'success' &&
      startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-dev-')
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Capture exact candidate identity
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          [[ "$commit" == "$GITHUB_SHA" ]] || exit 1
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || exit 1
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - name: Download exact canonical build artifacts
        uses: actions/download-artifact@v7
        with:
          path: canonical-artifacts

      - name: Download exact pinned Wayland Core publisher artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p canonical-artifacts/wayland-core-v0.12.25
          gh release download v0.12.25 \
            --repo FerroxLabs/wayland-core \
            --dir canonical-artifacts/wayland-core-v0.12.25 \
            --pattern 'wayland-core-v0.12.25-*'

      - name: Assemble complete raw acceptance source
        run: |
          node scripts/release-acceptance/assembleCanonicalRawAcceptance.js \
            --artifacts canonical-artifacts \
            --candidate '{"commit":"${{ steps.candidate.outputs.commit }}","tree":"${{ steps.candidate.outputs.tree }}"}' \
            --out "$RUNNER_TEMP/raw-release-acceptance"

      - name: Upload complete raw acceptance source
        uses: actions/upload-artifact@v6
        with:
          name: raw-release-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/raw-release-acceptance
          if-no-files-found: error
          retention-days: 7

  final-release-acceptance:
    name: Require protected exact-candidate final acceptance
    runs-on: ubuntu-latest
    needs: [assemble-raw-release-acceptance]
    permissions:
      actions: write
      attestations: read
      contents: read
    steps:
      - name: Dispatch protected trust-root workflow
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          requested_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run release-acceptance-trust-root.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref release-trust-v1 \
            -f candidate_ref="$GITHUB_SHA" \
            -f artifact_run_id="$GITHUB_RUN_ID"
          echo "requested_at=$requested_at" >> "$GITHUB_OUTPUT"

      - name: Resolve and wait for the protected run
        id: accepted
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_AT: ${{ steps.dispatch.outputs.requested_at }}
        run: |
          set -euo pipefail
          run_id=''
          for attempt in $(seq 1 30); do
            run_id="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/release-acceptance-trust-root.yml/runs?event=workflow_dispatch&branch=release-trust-v1&per_page=20" \
              --jq ".workflow_runs | map(select(.created_at >= \"$REQUESTED_AT\")) | sort_by(.created_at) | last | .id // empty")"
            [[ -n "$run_id" ]] && break
            sleep 10
          done
          [[ "$run_id" =~ ^[0-9]+$ ]] || exit 1
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download exact accepted receipt
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.accepted.outputs.run_id }}
          name: wayland-final-acceptance-${{ github.sha }}
          path: accepted

      - name: Verify exact accepted receipt and protected provenance
        env:
          GH_TOKEN: ${{ github.token }}
          TRUST_ROOT_SHA: ${{ vars.WAYLAND_RELEASE_TRUST_ROOT_SHA }}
        run: |
          set -euo pipefail
          jq -e --arg commit "$GITHUB_SHA" \
            '.contract == "wayland-final-acceptance/1.0" and .accepted == true and .candidate.commit == $commit' \
            accepted/final-acceptance-receipt.json >/dev/null
          gh attestation verify accepted/final-acceptance-receipt.json \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow FerroxLabs/wayland/.github/workflows/release-acceptance-trust-root.yml \
            --signer-digest "$TRUST_ROOT_SHA" \
            --source-digest "$TRUST_ROOT_SHA" \
            --source-ref refs/heads/release-trust-v1 \
            --deny-self-hosted-runners

  # Publish only after BOTH the macOS and Windows install gates pass. Keeping
  # publish in its own job (instead of inside the macOS gate) makes the draft ->
  # published flip depend on a green Windows signature too.
  publish-release:
    name: Publish Release (both gates passed)
    runs-on: ubuntu-latest
    needs: [release-smoke-gate, release-smoke-gate-windows, final-release-acceptance]
    if: |
      always() &&
      needs.release-smoke-gate.result == 'success' &&
      needs.release-smoke-gate-windows.result == 'success' &&
      needs.final-release-acceptance.result == 'success' &&
      startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-dev-')
    steps:
      - name: Resolve tag
        id: tag
        run: echo "tag_name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Publish the release (gates passed)
        # Mark NOT-prerelease + latest so repo visitors see the newest build on
        # /releases/latest (GitHub refuses to mark a prerelease as "latest").
        # This mirrors the manual rc.2.1 publish; change the policy here if you
        # want rc tags to stay flagged as prereleases instead.
        run: |
          TAG="${{ steps.tag.outputs.tag_name }}"
          echo "Both smoke gates green - publishing $TAG (latest, not-prerelease)"
          # This job does not checkout the repo, so gh has no .git to infer the
          # repo from; pass --repo explicitly or gh dies "not a git repository"
          # (which left v0.9.7 stuck as a draft after both gates passed).
          gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --latest --prerelease=false
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

  # Publish the `getwayland` self-host CLI to npm on every published release.
  # This is the headless web-server flavor (npm i -g getwayland), built from
  # installer/ and SEPARATE from the desktop GitHub Release assets above. It was
  # published manually once at 0.9.6 and then drifted ~5 releases stale; this
  # job keeps npm in lockstep with the desktop release. build-payload.mjs builds
  # the server bundle and syncs installer/package.json to the app version, so the
  # only inputs here are the checkout + an npm automation token.
  publish-getwayland-npm:
    name: Publish getwayland to npm
    runs-on: ubuntu-latest
    needs: [publish-release]
    # always() is REQUIRED: on a tag push the create-tag ancestor is skipped, and
    # without always() GitHub propagates that skip down this chain (the release /
    # publish-release jobs guard the same way). We still only publish when
    # publish-release actually succeeded.
    if: ${{ always() && needs.publish-release.result == 'success' }}
    steps:
      - name: Require an npm token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error title=NPM_TOKEN missing::Add an npm automation token as the NPM_TOKEN repo secret so the getwayland self-host CLI publishes on every release."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        shell: bash
        run: |
          # Retry: package.json pins a GitHub git dependency, so install traffic
          # hits api.github.com and an API 504 reds out this check for reasons
          # unrelated to the diff. Not a flaky-test workaround. Backoff 20s/40s
          # because an API outage outlasts a transient git fetch.
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile; then exit 0; fi
            echo "bun install attempt $attempt of 3 failed" >&2
            if [[ $attempt -lt 3 ]]; then sleep $(( attempt * 20 )); fi
          done
          echo "bun install failed after 3 attempts (GitHub API or registry unreachable)" >&2
          exit 1

      - name: Build the getwayland payload (syncs version to the release)
        working-directory: installer
        run: node scripts/build-payload.mjs

      - name: Publish to npm
        working-directory: installer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          case "$VERSION" in
            *-*) DIST_TAG=next ;;   # prerelease (rc / beta) -> npm `next`
            *)   DIST_TAG=latest ;; # stable -> npm `latest`
          esac
          echo "Publishing getwayland@$VERSION (dist-tag: $DIST_TAG)"
          # Idempotent: a workflow re-run must not fail on an already-published version.
          if npm view "getwayland@$VERSION" version >/dev/null 2>&1; then
            echo "getwayland@$VERSION is already on npm - skipping."
            exit 0
          fi
          npm publish --access public --tag "$DIST_TAG"
