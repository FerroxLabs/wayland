name: Release Acceptance Trust Root

# This file is authoritative only from the protected release-trust-v1 branch.
# Repository variable WAYLAND_RELEASE_TRUST_ROOT_SHA pins that branch's exact
# reviewed commit; a moving branch name alone is never acceptance authority.
on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Exact candidate commit SHA to verify
        required: true
        type: string
      artifact_run_id:
        description: Canonical build run containing raw acceptance evidence
        required: true
        type: string

concurrency:
  group: release-acceptance-trust-root-${{ inputs.candidate_ref }}
  cancel-in-progress: false

# Candidate execution must never inherit signing or attestation authority.
permissions:
  actions: read
  contents: read

jobs:
  candidate-gates:
    name: Execute exact candidate without trust authority
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      candidate-tree: ${{ steps.identity.outputs.tree }}
    env:
      TRUST_ROOT_SHA: ${{ vars.WAYLAND_RELEASE_TRUST_ROOT_SHA }}
      CANDIDATE_REF: ${{ inputs.candidate_ref }}
      ACTIONS_ID_TOKEN_REQUEST_URL: ''
      ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
    steps:
      - name: Enforce non-authoritative execution context
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/release-trust-v1" ]] || exit 1
          [[ "$TRUST_ROOT_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_SHA" == "$TRUST_ROOT_SHA" ]] || exit 1
          [[ "$CANDIDATE_REF" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" && -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]] || exit 1

      - name: Checkout exact candidate in untrusted execution job
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_REF }}
          path: candidate
          persist-credentials: false

      - name: Bind exact candidate source before execution
        id: identity
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_REF" ]] || exit 1
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || exit 1
          tree="$(git rev-parse 'HEAD^{tree}')"
          [[ "$tree" =~ ^[0-9a-f]{40,64}$ ]] || exit 1
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - name: Setup pinned untrusted candidate toolchain
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install exact candidate dependencies without credentials
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" && -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]] || exit 1
          # Retry: package.json pins a GitHub git dependency, so install traffic
          # hits api.github.com and an API 504 reds out this check for reasons
          # unrelated to the diff. Not a flaky-test workaround. Backoff 20s/40s
          # because an API outage outlasts a transient git fetch.
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile; then exit 0; fi
            echo "bun install attempt $attempt of 3 failed" >&2
            if [[ $attempt -lt 3 ]]; then sleep $(( attempt * 20 )); fi
          done
          echo "bun install failed after 3 attempts (GitHub API or registry unreachable)" >&2
          exit 1

      - name: Run untrusted candidate gates and capture raw outputs
        working-directory: candidate
        shell: bash
        env:
          GATE_OUTPUT: ${{ runner.temp }}/candidate-gates
        run: |
          set -euo pipefail
          umask 077
          [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" && -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]] || exit 1
          mkdir "$GATE_OUTPUT"
          records="$GATE_OUTPUT/gates.ndjson"
          : > "$records"
          run_gate() {
            local id="$1"
            local command="$2"
            local log="$GATE_OUTPUT/$id.log"
            set +e
            bash -o pipefail -c "$command" 2>&1 | tee "$log"
            local exit_code="${PIPESTATUS[0]}"
            set -e
            [[ "$exit_code" -eq 0 ]] || exit "$exit_code"
            local digest="sha256:$(sha256sum "$log" | cut -d' ' -f1)"
            jq -cn \
              --arg id "$id" --arg command "$command" --arg logPath "$id.log" \
              --arg logSha256 "$digest" --argjson exitCode "$exit_code" \
              '{id:$id,command:$command,exitCode:$exitCode,logPath:$logPath,logSha256:$logSha256}' \
              >> "$records"
          }
          run_gate tests 'bun run test'
          # `bun run typecheck`, not a raw `tsc`: package.json sets
          # NODE_OPTIONS=--max-old-space-size=8192 for this project, and without it the
          # check dies of heap exhaustion. Every other gate here already goes through
          # its script; this one bypassed it and would have OOM'd the first time this
          # job was reached - which has never happened.
          run_gate typecheck 'bun run typecheck'
          run_gate lint 'bun run lint'
          run_gate build 'bun run build:renderer:web'
          # `|| true` is REQUIRED here - `bun audit` exits non-zero whenever it
          # FINDS advisories, which is the normal case - but it also swallows a
          # registry 5xx/timeout, and that leaves the file EMPTY. The JSON.parse
          # below then dies with "Unexpected end of JSON input" and takes down a
          # 90-minute job for a reason that has nothing to do with the candidate.
          # That is exactly how v0.12.13 died, after every gate above it had
          # already passed and the renderer had finished building.
          #
          # So: retry like every other network op in this repo, and distinguish
          # "found advisories, wrote JSON" from "call failed, wrote nothing" by
          # requiring real bytes. A genuine audit failure still exits non-zero.
          audit_ok=0
          for attempt in 1 2 3; do
            bun audit --json > "$GATE_OUTPUT/dependency-audit.json" 2> "$GATE_OUTPUT/dependency-audit.stderr" || true
            if [[ -s "$GATE_OUTPUT/dependency-audit.json" ]]; then audit_ok=1; break; fi
            echo "bun audit produced no output (attempt $attempt of 3); retrying" >&2
            sleep $(( attempt * 15 ))
          done
          if [[ "$audit_ok" -ne 1 ]]; then
            echo "::error title=dependency audit unavailable::bun audit returned no JSON after 3 attempts" >&2
            cat "$GATE_OUTPUT/dependency-audit.stderr" >&2 || true
            exit 1
          fi
          node -e 'const fs=require("node:fs"); const value=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if (!value || typeof value!=="object" || Array.isArray(value)) process.exit(1)' \
            "$GATE_OUTPUT/dependency-audit.json"

      - name: Seal candidate gate handoff metadata
        working-directory: candidate
        shell: bash
        env:
          GATE_OUTPUT: ${{ runner.temp }}/candidate-gates
          CANDIDATE_TREE: ${{ steps.identity.outputs.tree }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_REF" ]] || exit 1
          [[ "$(git rev-parse 'HEAD^{tree}')" == "$CANDIDATE_TREE" ]] || exit 1
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || exit 1
          audit_digest="sha256:$(sha256sum "$GATE_OUTPUT/dependency-audit.json" | cut -d' ' -f1)"
          jq -s \
            --arg commit "$CANDIDATE_REF" \
            --arg tree "$CANDIDATE_TREE" \
            --arg trustRoot "$TRUST_ROOT_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg ref "$GITHUB_REF" \
            --arg sha "$GITHUB_SHA" \
            --arg workflowRef "$GITHUB_WORKFLOW_REF" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg job "$GITHUB_JOB" \
            --arg auditSha256 "$audit_digest" \
            '{contract:"wayland-untrusted-candidate-gates/1.0",candidate:{commit:$commit,tree:$tree},trustRoot:{commit:$trustRoot},workflow:{repository:$repository,ref:$ref,sha:$sha,workflowRef:$workflowRef,runId:$runId,runAttempt:$runAttempt,job:$job},audit:{path:"dependency-audit.json",sha256:$auditSha256},gates:.}' \
            "$GATE_OUTPUT/gates.ndjson" > "$GATE_OUTPUT/handoff.json"
          rm -f "$GATE_OUTPUT/gates.ndjson" "$GATE_OUTPUT/dependency-audit.stderr"

      - name: Upload immutable untrusted candidate gate outputs
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: candidate-gates-${{ inputs.candidate_ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-gates
          if-no-files-found: error
          retention-days: 7

  final-acceptance:
    name: Seal exact bytes with protected authority
    needs: candidate-gates
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    env:
      TRUST_ROOT_SHA: ${{ vars.WAYLAND_RELEASE_TRUST_ROOT_SHA }}
      CANDIDATE_REF: ${{ inputs.candidate_ref }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      GATE_ARTIFACT_ID: ${{ needs.candidate-gates.outputs.artifact-id }}
      GATE_ARTIFACT_DIGEST: ${{ needs.candidate-gates.outputs.artifact-digest }}
      CANDIDATE_TREE: ${{ needs.candidate-gates.outputs.candidate-tree }}
    steps:
      - name: Enforce protected immutable workflow identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/release-trust-v1" ]] || {
            echo "::error::trust-root workflow must run from refs/heads/release-trust-v1"
            exit 1
          }
          [[ "$TRUST_ROOT_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_SHA" == "$TRUST_ROOT_SHA" ]] || {
            echo "::error::workflow source is not the pinned release trust-root commit"
            exit 1
          }
          [[ "$CANDIDATE_REF" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$CANDIDATE_TREE" =~ ^[0-9a-f]{40,64}$ ]] || exit 1
          [[ "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          [[ "$GATE_ARTIFACT_ID" =~ ^[0-9]+$ ]] || exit 1
          # actions/upload-artifact emits `artifact-digest` as bare SHA-256 hex, while
          # the REST artifacts API returns the same digest as "sha256:<hex>". This
          # asserted the API's form against the producer's value, so it could never
          # match and this job has never once run past this line. Assert each surface
          # in its own documented form and compare the hex, below.
          [[ "$GATE_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]] || exit 1

      - name: Checkout pinned trust-root authority code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TRUST_ROOT_SHA }}
          path: trust-root
          persist-credentials: false

      - name: Checkout exact candidate as inert data only
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_REF }}
          path: candidate
          persist-credentials: false

      - name: Verify candidate data identity and immutability
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_REF" ]] || exit 1
          [[ "$(git rev-parse 'HEAD^{tree}')" == "$CANDIDATE_TREE" ]] || exit 1
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || exit 1
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/candidate-tree.txt"

      - name: Authenticate canonical producer run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ARTIFACT_RUN_ID}")"
          [[ "$(jq -r '.head_sha' <<<"$run_json")" == "$CANDIDATE_REF" ]] || exit 1
          [[ "$(jq -r '.path' <<<"$run_json")" == ".github/workflows/build-and-release.yml" ]] || exit 1
          [[ "$(jq -r '.event' <<<"$run_json")" == "push" ]] || exit 1
          status="$(jq -r '.status' <<<"$run_json")"
          [[ "$status" == "in_progress" || "$status" == "completed" ]] || exit 1
          conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
          [[ -z "$conclusion" || "$conclusion" == "success" ]] || exit 1

      - name: Authenticate same-run candidate gate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${GATE_ARTIFACT_ID}")"
          expected_name="candidate-gates-${CANDIDATE_REF}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$(jq -r '.name' <<<"$artifact")" == "$expected_name" ]] || exit 1
          [[ "$(jq -r '.expired' <<<"$artifact")" == "false" ]] || exit 1
          [[ "$(jq -r '.workflow_run.id | tostring' <<<"$artifact")" == "$GITHUB_RUN_ID" ]] || exit 1
          [[ "$(jq -r '.workflow_run.head_sha' <<<"$artifact")" == "$TRUST_ROOT_SHA" ]] || exit 1
          # The API returns "sha256:<hex>"; GATE_ARTIFACT_DIGEST is the producer's bare
          # hex. Require the API's prefixed form explicitly - so a future change of
          # digest algorithm fails closed rather than silently comparing something
          # else - then compare the exact 64 hex characters.
          api_digest="$(jq -r '.digest' <<<"$artifact")"
          [[ "$api_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          [[ "${api_digest#sha256:}" == "$GATE_ARTIFACT_DIGEST" ]] || exit 1

      - name: Download exact same-run candidate gate outputs
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.candidate-gates.outputs.artifact-id }}
          path: candidate-gate-download

      - name: Resolve exactly one candidate gate handoff
        id: gates
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' handoffs < <(find candidate-gate-download -type f -name handoff.json -print0)
          [[ "${#handoffs[@]}" -eq 1 ]] || exit 1
          root="$(dirname "${handoffs[0]}")"
          [[ -f "$root/dependency-audit.json" && ! -L "$root/dependency-audit.json" ]] || exit 1
          echo "path=$root" >> "$GITHUB_OUTPUT"

      - name: Promote authenticated candidate gates with protected code
        shell: bash
        run: |
          set -euo pipefail
          node trust-root/scripts/release-acceptance/promoteCandidateGateEvidence.js \
            --source "${{ steps.gates.outputs.path }}" \
            --out "$RUNNER_TEMP/protected-gates" \
            --candidateCommit "$CANDIDATE_REF" \
            --candidateTree "$CANDIDATE_TREE" \
            --trustRootCommit "$TRUST_ROOT_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --workflowRef "$GITHUB_WORKFLOW_REF" \
            --runId "$GITHUB_RUN_ID" \
            --runAttempt "$GITHUB_RUN_ATTEMPT" \
            --job candidate-gates

      - name: Download complete raw acceptance evidence bundle
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id }}
          name: raw-release-acceptance-${{ inputs.candidate_ref }}
          path: raw-download

      - name: Resolve exactly one raw evidence source root
        id: raw
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' candidates < <(find raw-download -type f -name candidate.json -print0)
          [[ "${#candidates[@]}" -eq 1 ]] || exit 1
          echo "path=$(dirname "${candidates[0]}")" >> "$GITHUB_OUTPUT"

      - name: Stage raw authority subjects
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.raw.outputs.path }}"
          mkdir intake-subjects
          mapfile -d '' subjects < <(
            find "$root/package-smokes" -maxdepth 1 -type f -name '*.json' -print0
            find "$root/updater-observations" -mindepth 2 -maxdepth 2 -type f -name observation.json -print0
            find "$root/capability-receipts" -maxdepth 1 -type f \( -name '*.json' -o -name '*.proof.log' \) -print0
          )
          [[ "${#subjects[@]}" -ge 23 ]] || exit 1
          index=0
          for subject in "${subjects[@]}"; do
            [[ -f "$subject" && ! -L "$subject" ]] || exit 1
            digest="$(sha256sum "$subject" | cut -d' ' -f1)"
            cp "$subject" "intake-subjects/$(printf '%03d' "$index")-$digest"
            index=$((index + 1))
          done

      - name: Attest protected raw authority inputs
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: intake-subjects/*

      - name: Recreate exact capability seal with protected code
        env:
          RAW_ROOT: ${{ steps.raw.outputs.path }}
          GH_TOKEN: ${{ github.token }}
          # writeCapabilitySeal is called without `verifyAttestedFile` and without
          # `candidateClaim`, so verifyCandidateCapabilitySeal resolves the trust root
          # from this env var and throws without it. The two later steps that run the
          # same code already set it; this step was missed.
          WAYLAND_RELEASE_TRUST_ROOT_SHA: ${{ env.TRUST_ROOT_SHA }}
        run: |
          node <<'NODE'
          const path = require('node:path');
          const { writeCapabilitySeal } = require('./trust-root/scripts/capability-seal/verifyCandidateCapabilitySeal');
          writeCapabilitySeal({
            root: path.resolve('candidate'),
            selectionFile: path.resolve('candidate/scripts/capability-seal/candidate-capabilities.json'),
            receiptsDir: path.resolve(process.env.RAW_ROOT, 'capability-receipts'),
            outputFile: path.resolve(process.env.RAW_ROOT, 'capability-seal.json'),
          });
          NODE

      - name: Produce protected acceptance evidence from actual bytes
        id: protected
        env:
          GH_TOKEN: ${{ github.token }}
          WAYLAND_ACCEPTANCE_CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          WAYLAND_RELEASE_TRUST_ROOT_SHA: ${{ env.TRUST_ROOT_SHA }}
        run: |
          node trust-root/scripts/release-acceptance/produceProtectedAcceptanceEvidence.js \
            --raw "${{ steps.raw.outputs.path }}" \
            --gates "$RUNNER_TEMP/protected-gates" \
            --out "$RUNNER_TEMP/protected-source"
          echo "path=$RUNNER_TEMP/protected-source" >> "$GITHUB_OUTPUT"

      - name: Index exact protected evidence bytes
        id: indexed
        run: |
          node trust-root/scripts/release-acceptance/collectRawAcceptanceEvidence.js \
            --source "${{ steps.protected.outputs.path }}" \
            --out "$RUNNER_TEMP/indexed-evidence"
          echo "path=$RUNNER_TEMP/indexed-evidence" >> "$GITHUB_OUTPUT"

      - name: Generate acceptance subjects from raw bytes
        id: generate
        run: |
          node trust-root/scripts/release-acceptance/generateTrustRootAcceptance.js \
            --raw "${{ steps.indexed.outputs.path }}" \
            --out "$RUNNER_TEMP/acceptance"
          echo "path=$RUNNER_TEMP/acceptance" >> "$GITHUB_OUTPUT"

      - name: Stage exact generated acceptance subjects
        shell: bash
        run: |
          set -euo pipefail
          mkdir attestation-subjects
          jq -e '.contract == "wayland-release-acceptance-attestation-subjects/1.0" and (.subjects | length > 32)' \
            "${{ steps.generate.outputs.path }}/attestation-subjects.json" >/dev/null
          while IFS=$'\t' read -r subject digest; do
            [[ "$subject" == "${{ steps.generate.outputs.path }}"/* ]] || exit 1
            observed="sha256:$(sha256sum "$subject" | cut -d' ' -f1)"
            [[ "$observed" == "$digest" ]] || exit 1
            cp "$subject" "attestation-subjects/${digest#sha256:}.json"
          done < <(jq -r '.subjects[] | [.path, .sha256] | @tsv' \
            "${{ steps.generate.outputs.path }}/attestation-subjects.json")
          expected="$(jq '.subjects | length' "${{ steps.generate.outputs.path }}/attestation-subjects.json")"
          [[ "$(find attestation-subjects -type f -name '*.json' | wc -l | tr -d ' ')" -eq "$expected" ]] || exit 1

      - name: Attest trust-root generated receipt and manifest bytes
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: attestation-subjects/*.json

      - name: Run protected final acceptance controller
        env:
          GH_TOKEN: ${{ github.token }}
          WAYLAND_ACCEPTANCE_CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          WAYLAND_CAPABILITY_RECEIPTS_DIR: ${{ steps.generate.outputs.path }}/inputs/capability-receipts
          WAYLAND_RELEASE_TRUST_ROOT_SHA: ${{ env.TRUST_ROOT_SHA }}
        run: |
          node trust-root/scripts/release-acceptance/verifyFinalAcceptance.js \
            "${{ steps.generate.outputs.path }}/final-acceptance-request.json" \
            > "$RUNNER_TEMP/final-acceptance-receipt.json"
          jq -e --arg commit "$CANDIDATE_REF" \
            '.contract == "wayland-final-acceptance/1.0" and .accepted == true and .candidate.commit == $commit' \
            "$RUNNER_TEMP/final-acceptance-receipt.json" >/dev/null

      - name: Attest accepted receipt
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ runner.temp }}/final-acceptance-receipt.json

      - name: Upload immutable accepted receipt
        uses: actions/upload-artifact@v7
        with:
          name: wayland-final-acceptance-${{ inputs.candidate_ref }}
          path: ${{ runner.temp }}/final-acceptance-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload protected acceptance evidence bundle
        uses: actions/upload-artifact@v7
        with:
          name: wayland-protected-acceptance-evidence-${{ inputs.candidate_ref }}
          path: |
            ${{ runner.temp }}/protected-gates
            ${{ runner.temp }}/indexed-evidence
            ${{ runner.temp }}/acceptance
          if-no-files-found: error
          retention-days: 90
