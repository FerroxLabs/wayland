name: Release Acceptance Trust Root

# This file is authoritative only from the protected release-trust-v1 branch.
# Repository variable WAYLAND_RELEASE_TRUST_ROOT_SHA pins that branch's exact
# reviewed commit; a moving branch name alone is never acceptance authority.
on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Exact candidate commit SHA to verify
        required: true
        type: string
      artifact_run_id:
        description: Canonical build run containing raw acceptance evidence
        required: true
        type: string

concurrency:
  group: release-acceptance-trust-root-${{ inputs.candidate_ref }}
  cancel-in-progress: false

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

jobs:
  final-acceptance:
    name: Seal exact raw bytes with protected authority
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TRUST_ROOT_SHA: ${{ vars.WAYLAND_RELEASE_TRUST_ROOT_SHA }}
      CANDIDATE_REF: ${{ inputs.candidate_ref }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
    steps:
      - name: Enforce protected immutable workflow identity
        run: |
          [[ "$GITHUB_REF" == "refs/heads/release-trust-v1" ]] || {
            echo "::error::trust-root workflow must run from refs/heads/release-trust-v1"
            exit 1
          }
          [[ "$TRUST_ROOT_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_SHA" == "$TRUST_ROOT_SHA" ]] || {
            echo "::error::workflow source is not the pinned release trust-root commit"
            exit 1
          }
          [[ "$CANDIDATE_REF" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]] || exit 1

      - name: Checkout pinned trust-root authority code
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TRUST_ROOT_SHA }}
          path: trust-root
          persist-credentials: false

      - name: Checkout exact candidate as data only
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_REF }}
          path: candidate
          persist-credentials: false

      - name: Verify candidate checkout identity and immutability
        working-directory: candidate
        run: |
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_REF" ]] || exit 1
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || exit 1
          git rev-parse 'HEAD^{tree}' > ../candidate-tree.txt

      - name: Authenticate canonical producer run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ARTIFACT_RUN_ID}")"
          [[ "$(jq -r '.head_sha' <<<"$run_json")" == "$CANDIDATE_REF" ]] || exit 1
          [[ "$(jq -r '.path' <<<"$run_json")" == ".github/workflows/build-and-release.yml" ]] || exit 1
          [[ "$(jq -r '.event' <<<"$run_json")" == "push" ]] || exit 1
          status="$(jq -r '.status' <<<"$run_json")"
          [[ "$status" == "in_progress" || "$status" == "completed" ]] || exit 1
          conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
          [[ -z "$conclusion" || "$conclusion" == "success" ]] || exit 1

      - name: Download complete raw acceptance evidence bundle
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id }}
          name: raw-release-acceptance-${{ inputs.candidate_ref }}
          path: raw-download

      - name: Resolve exactly one raw evidence source root
        id: raw
        shell: bash
        run: |
          mapfile -d '' candidates < <(find raw-download -type f -name candidate.json -print0)
          [[ "${#candidates[@]}" -eq 1 ]] || exit 1
          echo "path=$(dirname "${candidates[0]}")" >> "$GITHUB_OUTPUT"

      - name: Setup pinned protected toolchain
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install exact candidate dependencies
        working-directory: candidate
        run: bun install --frozen-lockfile

      - name: Stage raw authority subjects
        shell: bash
        run: |
          set -euo pipefail
          root="${{ steps.raw.outputs.path }}"
          mkdir intake-subjects
          mapfile -d '' subjects < <(
            find "$root/package-smokes" -maxdepth 1 -type f -name '*.json' -print0
            find "$root/updater-observations" -mindepth 2 -maxdepth 2 -type f -name observation.json -print0
            find "$root/capability-receipts" -maxdepth 1 -type f \( -name '*.json' -o -name '*.proof.log' \) -print0
          )
          [[ "${#subjects[@]}" -ge 23 ]] || exit 1
          index=0
          for subject in "${subjects[@]}"; do
            [[ -f "$subject" && ! -L "$subject" ]] || exit 1
            digest="$(sha256sum "$subject" | cut -d' ' -f1)"
            cp "$subject" "intake-subjects/$(printf '%03d' "$index")-$digest"
            index=$((index + 1))
          done

      - name: Attest protected raw authority inputs
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: intake-subjects/*

      - name: Recreate exact capability seal with protected code
        env:
          RAW_ROOT: ${{ steps.raw.outputs.path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const path = require('node:path');
          const { writeCapabilitySeal } = require('./trust-root/scripts/capability-seal/verifyCandidateCapabilitySeal');
          writeCapabilitySeal({
            root: path.resolve('candidate'),
            selectionFile: path.resolve('candidate/scripts/capability-seal/candidate-capabilities.json'),
            receiptsDir: path.resolve(process.env.RAW_ROOT, 'capability-receipts'),
            outputFile: path.resolve(process.env.RAW_ROOT, 'capability-seal.json'),
          });
          NODE

      - name: Run protected aggregate gates and capture immutable logs
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          gates="$RUNNER_TEMP/protected-gates"
          mkdir "$gates"
          records="$gates/gates.ndjson"
          : > "$records"
          run_gate() {
            local id="$1"
            local command="$2"
            local log="$gates/$id.log"
            set +e
            bash -o pipefail -c "$command" 2>&1 | tee "$log"
            local exit_code="${PIPESTATUS[0]}"
            set -e
            [[ "$exit_code" -eq 0 ]] || exit "$exit_code"
            local digest="sha256:$(sha256sum "$log" | cut -d' ' -f1)"
            jq -cn \
              --arg id "$id" --arg command "$command" --arg logPath "$id.log" \
              --arg logSha256 "$digest" --argjson exitCode "$exit_code" \
              '{id:$id,command:$command,exitCode:$exitCode,logPath:$logPath,logSha256:$logSha256}' \
              >> "$records"
          }
          run_gate tests 'bun run test'
          run_gate typecheck 'bunx tsc --noEmit'
          run_gate lint 'bun run lint'
          run_gate build 'bun run build:renderer:web'
          bun audit --json > "$gates/dependency-audit.json" 2> "$gates/dependency-audit.stderr" || true
          cp "$gates/dependency-audit.json" dependency-audit.json
          run_gate dependency-security \
            'node ../trust-root/scripts/release-acceptance/verifySevereDependencyAudit.js dependency-audit.json'
          rm -f dependency-audit.json
          jq -s \
            --arg commit "$CANDIDATE_REF" \
            --arg tree "$(cat ../candidate-tree.txt)" \
            '{contract:"wayland-protected-release-gates/1.0",candidate:{commit:$commit,tree:$tree},gates:.}' \
            "$records" > "$gates/gate-results.json"

      - name: Produce protected acceptance evidence from actual bytes
        id: protected
        env:
          GH_TOKEN: ${{ github.token }}
          WAYLAND_ACCEPTANCE_CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          WAYLAND_RELEASE_TRUST_ROOT_SHA: ${{ env.TRUST_ROOT_SHA }}
        run: |
          node trust-root/scripts/release-acceptance/produceProtectedAcceptanceEvidence.js \
            --raw "${{ steps.raw.outputs.path }}" \
            --gates "$RUNNER_TEMP/protected-gates" \
            --out "$RUNNER_TEMP/protected-source"
          echo "path=$RUNNER_TEMP/protected-source" >> "$GITHUB_OUTPUT"

      - name: Index exact protected evidence bytes
        id: indexed
        run: |
          node trust-root/scripts/release-acceptance/collectRawAcceptanceEvidence.js \
            --source "${{ steps.protected.outputs.path }}" \
            --out "$RUNNER_TEMP/indexed-evidence"
          echo "path=$RUNNER_TEMP/indexed-evidence" >> "$GITHUB_OUTPUT"

      - name: Generate acceptance subjects from raw bytes
        id: generate
        run: |
          node trust-root/scripts/release-acceptance/generateTrustRootAcceptance.js \
            --raw "${{ steps.indexed.outputs.path }}" \
            --out "$RUNNER_TEMP/acceptance"
          echo "path=$RUNNER_TEMP/acceptance" >> "$GITHUB_OUTPUT"

      - name: Stage exact generated acceptance subjects
        shell: bash
        run: |
          mkdir attestation-subjects
          jq -e '.contract == "wayland-release-acceptance-attestation-subjects/1.0" and (.subjects | length > 32)' \
            "${{ steps.generate.outputs.path }}/attestation-subjects.json" >/dev/null
          while IFS=$'\t' read -r subject digest; do
            [[ "$subject" == "${{ steps.generate.outputs.path }}"/* ]] || exit 1
            observed="sha256:$(sha256sum "$subject" | cut -d' ' -f1)"
            [[ "$observed" == "$digest" ]] || exit 1
            cp "$subject" "attestation-subjects/${digest#sha256:}.json"
          done < <(jq -r '.subjects[] | [.path, .sha256] | @tsv' \
            "${{ steps.generate.outputs.path }}/attestation-subjects.json")
          expected="$(jq '.subjects | length' "${{ steps.generate.outputs.path }}/attestation-subjects.json")"
          [[ "$(find attestation-subjects -type f -name '*.json' | wc -l | tr -d ' ')" -eq "$expected" ]] || exit 1

      - name: Attest trust-root generated receipt and manifest bytes
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: attestation-subjects/*.json

      - name: Run protected final acceptance controller
        env:
          GH_TOKEN: ${{ github.token }}
          WAYLAND_ACCEPTANCE_CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          WAYLAND_CAPABILITY_RECEIPTS_DIR: ${{ steps.generate.outputs.path }}/inputs/capability-receipts
          WAYLAND_RELEASE_TRUST_ROOT_SHA: ${{ env.TRUST_ROOT_SHA }}
        run: |
          node trust-root/scripts/release-acceptance/verifyFinalAcceptance.js \
            "${{ steps.generate.outputs.path }}/final-acceptance-request.json" \
            > "$RUNNER_TEMP/final-acceptance-receipt.json"
          jq -e --arg commit "$CANDIDATE_REF" \
            '.contract == "wayland-final-acceptance/1.0" and .accepted == true and .candidate.commit == $commit' \
            "$RUNNER_TEMP/final-acceptance-receipt.json" >/dev/null

      - name: Attest accepted receipt
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ runner.temp }}/final-acceptance-receipt.json

      - name: Upload immutable accepted receipt
        uses: actions/upload-artifact@v6
        with:
          name: wayland-final-acceptance-${{ inputs.candidate_ref }}
          path: ${{ runner.temp }}/final-acceptance-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload protected acceptance evidence bundle
        uses: actions/upload-artifact@v6
        with:
          name: wayland-protected-acceptance-evidence-${{ inputs.candidate_ref }}
          path: |
            ${{ runner.temp }}/protected-gates
            ${{ runner.temp }}/indexed-evidence
            ${{ runner.temp }}/acceptance
          if-no-files-found: error
          retention-days: 90
