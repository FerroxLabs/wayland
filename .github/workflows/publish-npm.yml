name: Publish getwayland to npm (manual)

# On-demand publish of the getwayland self-host CLI to npm. Checks out the `ref`
# you specify (a tag or branch) and publishes getwayland at that ref's
# app/package.json version (build-payload syncs installer/package.json to it).
# Use it to backfill a release whose automatic npm publish was skipped/failed.
# Requires the NPM_TOKEN repo secret. Idempotent: a version already on npm is a
# no-op. Dispatch is restricted to users with write access (workflow_dispatch).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or branch to publish from (its app/package.json version is published, e.g. v0.10.2)'
        required: true
        default: 'feat/workflows-collaborative-surface'

jobs:
  publish:
    name: Publish getwayland to npm
    runs-on: ubuntu-latest
    env:
      # #940: build-payload.mjs runs scripts/build-mcp-servers.js, which now
      # FAILS when a @wayland MCP connector cannot be bundled. Those four
      # connectors build from the sibling waylandmcp repo, which has no GitHub
      # remote yet, so CI must opt out explicitly. DELETE this the moment
      # waylandmcp is checkout-able in CI.
      WAYLAND_ALLOW_MISSING_MCP: '1'
    steps:
      - name: Require an npm token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error title=NPM_TOKEN missing::Add an npm automation token as the NPM_TOKEN repo secret."
            exit 1
          fi

      # `ref` comes from a write-access maintainer via workflow_dispatch (not
      # untrusted external input). It only selects which commit to publish.
      - name: Checkout the ref to publish
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        shell: bash
        run: |
          # Retry: package.json pins a GitHub git dependency, so install traffic
          # hits api.github.com and an API 504 reds out this check for reasons
          # unrelated to the diff. Not a flaky-test workaround. Backoff 20s/40s
          # because an API outage outlasts a transient git fetch.
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile; then exit 0; fi
            echo "bun install attempt $attempt of 3 failed" >&2
            if [[ $attempt -lt 3 ]]; then sleep $(( attempt * 20 )); fi
          done
          echo "bun install failed after 3 attempts (GitHub API or registry unreachable)" >&2
          exit 1

      - name: Build the getwayland payload (syncs version to app/package.json)
        working-directory: installer
        run: node scripts/build-payload.mjs

      - name: Publish to npm
        working-directory: installer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          case "$VERSION" in
            *-*) DIST_TAG=next ;;   # prerelease (rc / beta) -> npm `next`
            *)   DIST_TAG=latest ;; # stable -> npm `latest`
          esac
          echo "Publishing getwayland@$VERSION (dist-tag: $DIST_TAG)"
          if npm view "getwayland@$VERSION" version >/dev/null 2>&1; then
            echo "getwayland@$VERSION is already on npm - skipping."
            exit 0
          fi
          npm publish --access public --tag "$DIST_TAG"
