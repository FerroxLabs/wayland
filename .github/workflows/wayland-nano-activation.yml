name: Wayland Nano exact artifact

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wayland-nano-activation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  exact-artifact:
    name: Exact artifact (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout exact Desktop change
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install Desktop dependencies from lock
        run: bun install --frozen-lockfile

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Fresh Nano checkout, locked builds and exact-artifact matrix
        run: >-
          bun run scripts/verify-wayland-nano-activation.ts
          --require-fresh-nano-checkout
          --require-terminal-refusal

  production-bootstrap-contract:
    name: Production bootstrap contract
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact Desktop change
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install Desktop dependencies from lock
        run: bun install --frozen-lockfile
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Verify signed offline challenge/apply and ordinary bootstrap refusal contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP "nano-bootstrap-$env:GITHUB_RUN_ID"
          git -c core.autocrlf=false clone --filter=blob:none --no-checkout https://github.com/FerroxLabs/wayland-nano.git "$root/nano"
          git -C "$root/nano" config core.autocrlf false
          git -C "$root/nano" fetch --depth=1 origin 75a192920b27a5a485df91e35154be6dacba414c
          git -C "$root/nano" checkout --detach 75a192920b27a5a485df91e35154be6dacba414c
          $env:CARGO_TARGET_DIR = "$root/target"
          cargo test --locked --manifest-path "$root/nano/Cargo.toml" -p nano-activation --lib
          cargo test --locked --manifest-path "$root/nano/Cargo.toml" -p nano-activation --test offline_bootstrap -- --test-threads=1
          cargo test --locked --manifest-path "$root/nano/Cargo.toml" -p nano-activation --features phase2-fixture --test phase2_fixture -- --test-threads=1
          cargo test --locked --manifest-path "$root/nano/Cargo.toml" -p nano-cli --test offline_bootstrap_cli --test activation_cli -- --test-threads=1
