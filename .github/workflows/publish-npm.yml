name: Publish getwayland to npm (manual)

# On-demand publish of the getwayland self-host CLI to npm. Checks out the tag
# you specify and publishes getwayland at THAT tag's app/package.json version
# (build-payload syncs installer/package.json from it), so a backfill can never
# publish whatever happens to be on main. Use it for a release whose automatic
# npm publish was skipped or failed - e.g. a draft release flipped by hand, so
# the publish-release job in build-and-release.yml never ran.
#
# The publish steps live in _publish-getwayland-npm-reusable.yml, shared with
# build-and-release.yml. Requires the NPM_TOKEN repo secret. Idempotent: a
# version already on npm is a no-op. Dispatch is restricted to users with write
# access (workflow_dispatch).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag to publish from (e.g. v0.12.0). Any branch/SHA also works.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish getwayland to npm
    uses: ./.github/workflows/_publish-getwayland-npm-reusable.yml
    permissions:
      contents: read
    with:
      ref: ${{ inputs.tag }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
